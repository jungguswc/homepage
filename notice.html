<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지사항 | 대구중구지역사회보장협의체</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  --main:#3346A8; --main-d:#22307A; --main-l:#EEF0FA;
  --sky:#29A8E0; --accent:#F2A33A; --ink:#1C2033; --muted:#5B6075; --line:#DFE2EE;
  --bg:#ffffff; --soft:#F5F6FB; --ok:#1E7A4C; --ok-l:#E3F4EA; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;word-break:keep-all;font-size:16px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.draft{background:var(--accent);color:#3a2500;text-align:center;font-size:13px;padding:6px 16px;font-weight:500}

header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:20}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;color:var(--main-d)}
.logo .mark{width:42px;height:42px;object-fit:contain;flex-shrink:0}
.logo small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.03em}
.menu{display:flex;gap:20px;font-weight:500;font-size:15px}
.menu a:hover,.menu a.on{color:var(--main)}
.menu a.on{font-weight:700}
.burger{display:none;background:none;border:0;font-size:26px;cursor:pointer;color:var(--main-d)}
@media(max-width:1020px){
  .menu{display:none;position:absolute;top:70px;left:0;right:0;background:#fff;flex-direction:column;gap:0;border-bottom:1px solid var(--line)}
  .menu.open{display:flex}
  .menu a{padding:14px 16px;border-top:1px solid var(--line)}
  .burger{display:block}
}

.sub-hero{background:linear-gradient(120deg,var(--main-d),var(--main));color:#fff;padding:40px 0 44px}
.crumb{font-size:13px;opacity:.8;margin-bottom:8px}
.crumb a:hover{text-decoration:underline}
.sub-hero h1{font-size:clamp(26px,4vw,34px);font-weight:900}
.sub-hero p{opacity:.88;margin-top:6px;font-size:15px}



main.wrap{padding-block:28px 72px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.switch{display:flex;gap:6px;background:var(--soft);border-radius:999px;padding:4px}
.switch a{padding:7px 18px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--muted)}
.switch a.on{background:#fff;color:var(--main-d);font-weight:700;box-shadow:0 1px 4px rgba(34,48,122,.12)}
.write{background:var(--accent);color:#3a2500;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14.5px;white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--main);border-color:var(--main);color:#fff}
.board{border-top:2px solid var(--main-d)}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:15px 8px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--soft)}
.row:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.row.pin{background:#FFF8EC}
.row .tt{flex:1;min-width:0;font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.pin .tt{font-weight:700}
.row time{font-size:13.5px;color:var(--muted);flex-shrink:0}
.clip{font-size:13px;color:var(--muted);flex-shrink:0}
.head{flex-shrink:0;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--main-l);color:var(--main)}
.head.h-공고{background:#FFF1DB;color:#8A5300}
.head.h-모집{background:#E3F4EA;color:var(--ok)}
.head.h-교육{background:#E2F3FB;color:#13658C}
.head.h-회의{background:#EFEAF8;color:#5B3D99}
.head.h-캠페인{background:#FDE8EC;color:#B4234A}
.new{font-size:11px;font-weight:700;color:#fff;background:#E2553D;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
@media(max-width:560px){.row{flex-wrap:wrap;gap:6px 10px}.row .tt{flex-basis:100%;order:3;white-space:normal}}
dialog{border:0;border-radius:18px;padding:0;max-width:760px;width:calc(100% - 32px);max-height:calc(100% - 48px)}
dialog::backdrop{background:rgba(20,24,45,.6)}
.dlg{padding:22px 24px 26px}
.dlg-top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.dlg h2{font-size:22px;color:var(--main-d);line-height:1.4;margin-top:6px}
.x{border:0;background:var(--soft);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;flex-shrink:0}
.dlg .body{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:15.5px;white-space:pre-line}
.files{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.files a{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14.5px;color:var(--main-d);word-break:break-all}
.files a:hover{border-color:var(--main);background:var(--main-l)}
.files a.lnk{background:var(--main);border-color:var(--main);color:#fff;justify-content:center;font-weight:700}
.shots{display:grid;gap:10px;margin-top:16px}
.shots img{width:100%;max-width:100%;border-radius:10px;display:block}

footer{background:#151A33;color:#B6BBD1;padding:36px 0;font-size:14px}
footer b{color:#fff}

</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a href="./" class="logo"><img class="mark" src="logo.png" alt="" width="42" height="42"><span>대구중구지역사회보장협의체<small>DAEGU JUNG-GU SOCIAL SECURITY COUNCIL</small></span></a>
    <nav class="menu" id="menu">
      <a href="index.html#about">협의체 소개</a>
      <a href="bunkwa.html">실무분과</a>
      <a href="dong.html">동 협의체</a>
      <a href="jawon.html">복지자원</a>
      <a href="index.html#biz">주요사업</a>
      <a href="news.html" class="on">소식·공지</a>
      <a href="gyehoek.html">자료실</a>
      <a href="index.html#contact">참여·문의</a>
    </nav>
    <button class="burger" aria-label="메뉴 열기" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>
  </div>
</header>

<div class="sub-hero">
  <div class="wrap">
    <div class="crumb"><a href="./">홈</a> › 공지사항</div>
    <h1>공지사항</h1>
    <p>회의·교육·모집 안내와 협의체 공고를 알려 드립니다</p>
  </div>
</div>

<main class="wrap">
  <div class="bar">
    <nav class="switch" aria-label="소식·공지"><a href="notice.html" class="on" aria-current="page">공지사항</a><a href="news.html">활동 소식</a></nav>
    <a class="write" href="write.html?type=notice">✎ 공지 올리기</a>
  </div>
  <div class="tabs" role="group" aria-label="말머리"></div>
  <div class="board" id="list" aria-live="polite"><p class="empty">공지를 불러오고 있어요…</p></div>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg">
    <div class="dlg-top"><div><div class="meta" id="dlg-meta"></div><h2 id="dlg-title"></h2></div><button class="x" type="button" aria-label="닫기" onclick="document.getElementById('dlg').close()">✕</button></div>
    <p class="body" id="dlg-body"></p>
    <div class="shots" id="dlg-shots"></div>
    <div class="files" id="dlg-files"></div>
  </div>
</dialog>

<footer>
  <div class="wrap"><b>대구중구지역사회보장협의체 사무국</b> · 대구광역시 중구 국채보상로139길 1, 4층 · 전화 053-661-2288 · actor0204@korea.kr · © 2026</div>
</footer>

<script src="news.js"></script>
<script>
let ALL = [], head = "전체";
const tabs = document.querySelector(".tabs");
tabs.innerHTML = ["전체"].concat(NOTICE_HEADS).map(h => `<button type="button" class="tab" data-h="${h}" aria-pressed="${h === "전체"}">${h}</button>`).join("");

function headBadge(n){ return `<span class="head h-${newsEsc(n.head)}">${newsEsc(n.head || "공지")}</span>`; }

function draw(){
  const rows = ALL.filter(n => head === "전체" || n.head === head);
  const el = document.getElementById("list");
  if (!rows.length) { el.innerHTML = `<p class="empty">아직 올라온 공지가 없어요.</p>`; return; }
  el.innerHTML = rows.map(n => `
    <button type="button" class="row ${n.pin ? "pin" : ""}" data-id="${newsEsc(n.id)}">
      ${n.pin ? `<span aria-label="상단 고정">📌</span>` : ""}${headBadge(n)}
      <span class="tt">${newsEsc(n.title)}${noticeIsNew(n) ? `<span class="new">N</span>` : ""}</span>
      ${(n.files || []).length ? `<span class="clip" aria-label="첨부파일 있음">📎</span>` : ""}
      <time>${newsDate(n.date)}</time>
    </button>`).join("");
}

function open_(n){
  document.getElementById("dlg-meta").innerHTML = `${headBadge(n)}<time>${newsDate(n.date)}</time>`;
  document.getElementById("dlg-title").textContent = n.title;
  document.getElementById("dlg-body").textContent = n.body;
  document.getElementById("dlg-shots").innerHTML = (n.photos || []).map((p, i) => newsImg(p, 1600, `${n.title} 이미지 ${i + 1}`)).join("");
  document.getElementById("dlg-files").innerHTML =
    (n.files || []).map(f => `<a href="${newsEsc(noticeFileUrl(f))}" target="_blank" rel="noopener">📎 ${newsEsc(f.name || "첨부파일")}</a>`).join("") +
    (n.link ? `<a class="lnk" href="${newsEsc(n.link)}" target="_blank" rel="noopener">관련 페이지 바로가기 →</a>` : "");
  const d = document.getElementById("dlg");
  if (!d.open) d.showModal();
  history.replaceState(null, "", "#" + encodeURIComponent(n.id));
}

tabs.addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  head = b.dataset.h;
  tabs.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", String(t === b)));
  draw();
});
document.getElementById("list").addEventListener("click", e => {
  const r = e.target.closest(".row"); if (!r) return;
  const n = ALL.find(x => String(x.id) === r.dataset.id); if (n) open_(n);
});
const dlg = document.getElementById("dlg");
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("close", () => history.replaceState(null, "", location.pathname));

loadNotices().then(items => {
  ALL = items; draw();
  const id = decodeURIComponent(location.hash.slice(1));
  const n = id && ALL.find(x => String(x.id) === id);
  if (n) open_(n);
});
</script>
</body>
