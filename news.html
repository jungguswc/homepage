<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>활동 소식 | 대구중구지역사회보장협의체</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  --main:#3346A8; --main-d:#22307A; --main-l:#EEF0FA;
  --sky:#29A8E0; --accent:#F2A33A; --ink:#1C2033; --muted:#5B6075; --line:#DFE2EE;
  --bg:#ffffff; --soft:#F5F6FB; --ok:#1E7A4C; --ok-l:#E3F4EA; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;word-break:keep-all;font-size:16px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.draft{background:var(--accent);color:#3a2500;text-align:center;font-size:13px;padding:6px 16px;font-weight:500}

header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:20}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;color:var(--main-d)}
.logo .mark{width:42px;height:42px;object-fit:contain;flex-shrink:0}
.logo small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.03em}
.menu{display:flex;gap:20px;font-weight:500;font-size:15px}
.menu a:hover,.menu a.on{color:var(--main)}
.menu a.on{font-weight:700}
.burger{display:none;background:none;border:0;font-size:26px;cursor:pointer;color:var(--main-d)}
@media(max-width:1020px){
  .menu{display:none;position:absolute;top:70px;left:0;right:0;background:#fff;flex-direction:column;gap:0;border-bottom:1px solid var(--line)}
  .menu.open{display:flex}
  .menu a{padding:14px 16px;border-top:1px solid var(--line)}
  .burger{display:block}
}

.sub-hero{background:linear-gradient(120deg,var(--main-d),var(--main));color:#fff;padding:40px 0 44px}
.crumb{font-size:13px;opacity:.8;margin-bottom:8px}
.crumb a:hover{text-decoration:underline}
.sub-hero h1{font-size:clamp(26px,4vw,34px);font-weight:900}
.sub-hero p{opacity:.88;margin-top:6px;font-size:15px}



main.wrap{padding-block:28px 72px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--main);border-color:var(--main);color:#fff}
.tabs select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;color:var(--ink)}
.write{background:var(--accent);color:#3a2500;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14.5px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;transition:.2s}
.card:hover{border-color:var(--main);transform:translateY(-2px);box-shadow:0 8px 20px rgba(34,48,122,.08)}
.card:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.card .ph{aspect-ratio:4/3;background:var(--soft) center/cover no-repeat;position:relative;max-width:100%}
.card .ph em{position:absolute;right:10px;bottom:10px;font-style:normal;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:6px;padding:2px 8px}
.card .tx{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px}
.meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--main-l);color:var(--main)}
.badge.dong{background:#FFF1DB;color:#8A5300}
.card h3{font-size:17px;line-height:1.4;color:var(--main-d)}
.card p{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:18px;padding:0;max-width:760px;width:calc(100% - 32px);max-height:calc(100% - 48px)}
dialog::backdrop{background:rgba(20,24,45,.6)}
.dlg{padding:22px 24px 26px}
.dlg-top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.dlg h2{font-size:22px;color:var(--main-d);line-height:1.4;margin-top:6px}
.x{border:0;background:var(--soft);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;flex-shrink:0}
.dlg .body{margin-top:12px;font-size:15.5px;white-space:pre-line}
.shots{display:grid;gap:10px;margin-top:16px}
.shots img{width:100%;max-width:100%;border-radius:10px;display:block}

footer{background:#151A33;color:#B6BBD1;padding:36px 0;font-size:14px}
footer b{color:#fff}
.ph{background:rgba(242,163,58,.25);border-radius:3px;padding:0 4px;color:#fff}

</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="./" class="logo"><img class="mark" src="logo.png" alt="" width="42" height="42"><span>대구중구지역사회보장협의체<small>DAEGU JUNG-GU SOCIAL SECURITY COUNCIL</small></span></a>
    <nav class="menu" id="menu">
      <a href="index.html#about">협의체 소개</a>
      <a href="bunkwa.html">실무분과</a>
      <a href="dong.html">동 협의체</a>
      <a href="jawon.html">복지자원</a>
      <a href="index.html#biz">주요사업</a>
      <a href="news.html" class="on">소식·공지</a>
      <a href="gyehoek.html">자료실</a>
      <a href="index.html#contact">참여·문의</a>
    </nav>
    <button class="burger" aria-label="메뉴 열기" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>
  </div>
</header>

<div class="sub-hero">
  <div class="wrap">
    <div class="crumb"><a href="./">홈</a> › 활동 소식</div>
    <h1>협의체 활동 소식</h1>
    <p>구 협의체와 12개 동 협의체의 활동을 사진과 함께 전합니다</p>
  </div>
</div>

<main class="wrap">
  <div class="bar">
    <div class="tabs" role="group" aria-label="소식 구분">
      <button type="button" class="tab" data-c="전체" aria-pressed="true">전체</button>
      <button type="button" class="tab" data-c="구 협의체" aria-pressed="false">구 협의체</button>
      <button type="button" class="tab" data-c="동 협의체" aria-pressed="false">동 협의체</button>
      <select id="dong" aria-label="동 선택" hidden><option value="">12개 동 전체</option></select>
    </div>
    <a class="write" href="write.html">✎ 소식 올리기</a>
  </div>
  <div id="list" class="grid" aria-live="polite"><p class="empty">소식을 불러오고 있어요…</p></div>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg">
    <div class="dlg-top"><div><div class="meta" id="dlg-meta"></div><h2 id="dlg-title"></h2></div><button class="x" type="button" aria-label="닫기" onclick="document.getElementById('dlg').close()">✕</button></div>
    <p class="body" id="dlg-body"></p>
    <div class="shots" id="dlg-shots"></div>
  </div>
</dialog>

<footer>
  <div class="wrap"><b>대구중구지역사회보장협의체 사무국</b> · 대구광역시 중구 국채보상로139길 1, 4층 · 전화 053-661-2288 · actor0204@korea.kr · © 2026</div>
</footer>

<script src="news.js"></script>
<script>
let ALL = [], cat = "전체";
const dongSel = document.getElementById("dong");
dongSel.insertAdjacentHTML("beforeend", NEWS_DONGS.map(d => `<option>${d}</option>`).join(""));

function draw(){
  const d = dongSel.value;
  const rows = ALL.filter(n => (cat === "전체" || n.category === cat) && (cat !== "동 협의체" || !d || n.dong === d));
  const el = document.getElementById("list");
  if (!rows.length) { el.innerHTML = `<p class="empty" style="grid-column:1/-1">아직 올라온 소식이 없어요.</p>`; return; }
  el.innerHTML = rows.map((n, i) => `
    <button type="button" class="card" data-i="${ALL.indexOf(n)}">
      <div class="ph" style="background-image:url('${newsEsc(newsPhotoUrl(n.photos[0], 800))}')">${n.photos.length > 1 ? `<em>사진 ${n.photos.length}장</em>` : ""}</div>
      <div class="tx">
        <div class="meta"><span class="badge ${n.category === "동 협의체" ? "dong" : ""}">${newsEsc(newsTag(n))}</span><time>${newsDate(n.date)}</time></div>
        <h3>${newsEsc(n.title)}</h3>
        <p>${newsEsc(n.body)}</p>
      </div>
    </button>`).join("");
}

function open_(n){
  document.getElementById("dlg-meta").innerHTML = `<span class="badge ${n.category === "동 협의체" ? "dong" : ""}">${newsEsc(newsTag(n))}</span><time>${newsDate(n.date)}</time>`;
  document.getElementById("dlg-title").textContent = n.title;
  document.getElementById("dlg-body").textContent = n.body;
  document.getElementById("dlg-shots").innerHTML = n.photos.map((p, i) => `<img src="${newsEsc(newsPhotoUrl(p, 1600))}" alt="${newsEsc(n.title)} 사진 ${i + 1}" loading="lazy">`).join("");
  document.getElementById("dlg").showModal();
}

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  cat = b.dataset.c;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", String(t === b)));
  dongSel.hidden = cat !== "동 협의체";
  draw();
});
dongSel.addEventListener("change", draw);
document.getElementById("list").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (c) open_(ALL[+c.dataset.i]);
});
document.getElementById("dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });

loadNews().then(items => { ALL = items; draw(); });
</script>
</body>
</html>
